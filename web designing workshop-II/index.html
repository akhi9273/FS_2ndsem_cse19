<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Result Calculator</h2>

        <div id="subjects">
            <input type="text" placeholder="Subject 1 Name" id="sub1">
            <input type="number" placeholder="Marks" id="mark1">
            <input type="text" placeholder="Grade" id="grade1">

            <input type="text" placeholder="Subject 2 Name" id="sub2">
            <input type="number" placeholder="Marks" id="mark2">
            <input type="text" placeholder="Grade" id="grade2">

            <input type="text" placeholder="Subject 3 Name" id="sub3">
            <input type="number" placeholder="Marks" id="mark3">
            <input type="text" placeholder="Grade" id="grade3">

            <input type="text" placeholder="Subject 4 Name" id="sub4">
            <input type="number" placeholder="Marks" id="mark4">
            <input type="text" placeholder="Grade" id="grade4">

            <input type="text" placeholder="Subject 5 Name" id="sub5">
            <input type="number" placeholder="Marks" id="mark5">
            <input type="text" placeholder="Grade" id="grade5">
        </div>

        <button onclick="calculate()">Show Result</button>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
